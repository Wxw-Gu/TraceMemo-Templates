name: validate templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository structure
        run: node scripts/validate-structure.cjs
      - name: Check package and catalog consistency
        run: node scripts/validate-structure.cjs --catalog

  production-fragments:
    needs: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the TraceMemo production renderer
        uses: actions/checkout@v4
        with:
          repository: Wxw-Gu/TraceMemo
          ref: main
          path: .tracememo
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Build the TraceMemo report-template test entry
        working-directory: .tracememo
        run: |
          pnpm install --frozen-lockfile
          pnpm test:e2e:build
      - name: Validate published packages against production fragments
        run: TRACEMEMO_ROOT="$GITHUB_WORKSPACE/.tracememo" node scripts/validate-production-fragments.cjs
